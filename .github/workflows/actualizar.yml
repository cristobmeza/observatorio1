name: Actualizar noticias
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - run: |
          git config user.name "observatorio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json estado.json
          git diff --staged --quiet || git commit -m "Actualizar noticias"
          git push
