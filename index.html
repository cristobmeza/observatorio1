<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OBSERVATORIO</title>
<style>
:root{--bg:#fff;--bg2:#f3f4f6;--tx:#111827;--mu:#6b7280;--ac:#1e3a5f;--bd:#d1d5db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--bg2:#1a1d24;--tx:#e5e7eb;--mu:#9ca3af;--ac:#8fb0dc;--bd:#2f3440}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:0 14px}
header{border-bottom:2px solid var(--tx);padding:14px 0 8px}
h1{font:700 clamp(24px,6vw,38px)/1 Georgia,"Times New Roman",serif;letter-spacing:.18em;margin:0;color:var(--ac)}
.dt{color:var(--mu);font-size:13px;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:7px 10px}
input[type=search]{flex:1;min-width:150px}
button{cursor:pointer}button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 8px}
nav button.on{background:none;color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.st{background:var(--bg2);border-left:3px solid var(--ac);padding:8px 12px;margin:12px 0;font-size:13px;color:var(--mu)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin:12px 0 30px}
.card{border:1px solid var(--bd);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card.f{grid-column:1/-1;border-top:3px solid var(--ac)}
.m{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card h3{font:600 18px/1.25 Georgia,serif;margin:0}.card.f h3{font-size:24px}
.card p{margin:0;color:var(--mu);font-size:14px}
.tg{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--ac);color:var(--ac);margin-left:4px}
.tg.d{border-color:var(--mu);color:var(--mu)}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.ac button,.ac a{font-size:13px;padding:4px 8px;text-decoration:none;color:var(--ac);border:1px solid var(--bd);border-radius:4px;background:var(--bg)}
h2{font:600 20px Georgia,serif;margin:20px 0 6px;border-bottom:1px solid var(--bd);padding-bottom:4px}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.li a{color:var(--ac)}.sm{font-size:12px;color:var(--mu)}
.fm{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.fm input{flex:1;min-width:120px}
label.c{display:inline-block;margin:3px 12px 3px 0}
</style></head><body><div class="w">
<header><h1>OBSERVATORIO</h1><div class="dt" id="dt"></div></header>
<div class="bar"><input type="search" id="q" placeholder="Buscar por palabras clave…">
<select id="sg"></select><select id="ss"></select><select id="so"><option value="new">Más recientes</option><option value="old">Más antiguas</option><option value="src">Medio (A–Z)</option></select></div>
<nav id="nv"></nav>
<div id="app"></div></div>
<script>
const G=[
{id:"A",n:"Chile",s:["Gobierno y administración pública","Congreso Nacional","Partidos políticos","Elecciones","Economía nacional","Sociedad","Regiones (Los Ríos)"]},
{id:"B",n:"Internacional",s:["América Latina","Estados Unidos y Canadá","Europa","Rusia y espacio postsoviético","China y Asia","Oriente Medio","África","Relaciones internacionales y geopolítica","Conflictos armados y seguridad internacional"]},
{id:"C",n:"Economía",s:["Economía chilena","Economía internacional","Política monetaria","Finanzas públicas","Tributación","Comercio internacional","Empresas y mercados"]},
{id:"D",n:"Derecho e instituciones",s:["Legislación chilena","Actividad parlamentaria","Jurisprudencia","Administración pública","Derecho constitucional","Derecho administrativo","Derecho tributario","Derecho internacional"]},
{id:"E",n:"Pensamiento y análisis",s:["Ciencia política","Teoría del Estado","Filosofía política","Socialismo y pensamiento económico","Historia contemporánea","Relaciones internacionales","Políticas públicas"]}];
const SRC0=[
["CIPER Chile","https://www.ciperchile.cl",""],["Radio Bío-Bío","https://www.biobiochile.cl",""],["Radio Cooperativa","https://cooperativa.cl",""],["El Mostrador","https://www.elmostrador.cl",""],["Ex-Ante","https://www.ex-ante.cl",""],["Emol","https://www.emol.com",""],["Río en Línea","https://www.rioenlinea.cl",""],
["Reuters","https://www.reuters.com",""],["Associated Press","https://apnews.com",""],["BBC Mundo","https://www.bbc.com/mundo","https://feeds.bbci.co.uk/mundo/rss.xml"],["Deutsche Welle","https://www.dw.com/es","https://rss.dw.com/xml/rss-sp-all"],["France 24","https://www.france24.com/es",""],["Al Jazeera","https://www.aljazeera.com","https://www.aljazeera.com/xml/rss/all.xml"],["The Guardian","https://www.theguardian.com","https://www.theguardian.com/world/rss"],["Agencia EFE","https://efe.com",""]
].map((a,i)=>({id:"s"+i,n:a[0],u:a[1],r:a[2],ch:i<7}));
const OFI={"Chile":[["Biblioteca del Congreso Nacional","https://www.bcn.cl"],["Diario Oficial","https://www.diariooficial.interior.gob.cl"],["Cámara de Diputadas y Diputados","https://www.camara.cl"],["Senado","https://www.senado.cl"],["Contraloría General de la República","https://www.contraloria.cl"],["Banco Central de Chile","https://www.bcentral.cl"],["Instituto Nacional de Estadísticas","https://www.ine.gob.cl"],["Dirección de Presupuestos","https://www.dipres.gob.cl"],["Servicio Electoral","https://www.servel.cl"],["Poder Judicial","https://www.pjud.cl"]],
"Internacionales":[["Naciones Unidas","https://www.un.org"],["Fondo Monetario Internacional","https://www.imf.org"],["Banco Mundial","https://www.worldbank.org"],["OCDE","https://www.oecd.org"],["CEPAL","https://www.cepal.org"],["Organización Mundial del Comercio","https://www.wto.org"],["Organización Mundial de la Salud","https://www.who.int"],["Organismo Internacional de Energía Atómica","https://www.iaea.org"],["ACNUR","https://www.acnur.org"]],
"Publicaciones y centros de estudios":[["Revista Estudios Internacionales (U. de Chile)","https://www.revistaei.uchile.cl"],["Estudios Públicos (CEP)","https://www.cepchile.cl"],["Revista de Ciencia Política (UC)","https://www.revistacienciapolitica.cl"],["Chatham House","https://www.chathamhouse.org"],["International Crisis Group","https://www.crisisgroup.org"],["Publicaciones de CEPAL","https://www.cepal.org/es/publicaciones"],["Publicaciones del FMI","https://www.imf.org/en/Publications"]]};
const ALLSUB=G.flatMap(g=>g.s.map(s=>({g:g.id,s})));
const ld=(k,d)=>{try{const v=localStorage.getItem("obs_"+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem("obs_"+k,JSON.stringify(v))}catch(e){}};
let sources=ld("src",SRC0),fav=ld("fav",{}),later=ld("later",{}),hist=ld("hist",[]),hid=ld("hid",[]);
let items=[],mode="demo",stamp="";
const st={v:"home",g:"all",s:"all",src:"all",o:"new",q:""};
const $=id=>document.getElementById(id);
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function demo(){const out=[],now=Date.now();let k=0;
SRC0.forEach((s,i)=>{for(let j=0;j<4;j++){const c=ALLSUB[(i*5+j*7)%ALLSUB.length];out.push({id:"d"+(k++),src:s.n,title:"[DEMO] Titular de ejemplo · "+c.s,desc:"Texto de demostración. No es una noticia real: sirve para probar la interfaz.",url:s.u,date:new Date(now-(i*3+j*11+1)*36e5).toISOString(),cat:c.s,demo:1})}});return out}
async function load(){items=demo();
try{const r=await fetch("news.json",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();
if(Array.isArray(j.items)&&j.items.length){items=j.items.map((x,i)=>({id:x.id||"r"+i,src:x.source||x.src,title:x.title,desc:x.description||x.desc||"",url:x.url,date:x.date,cat:x.category||x.cat||""}));mode="real";stamp=j.updated||""}}catch(e){}
render()}
function fdate(d){const x=new Date(d);return isNaN(x)?"s/f":x.toLocaleString("es-CL",{dateStyle:"medium",timeStyle:"short"})}
function pool(){const hs=new Set(hid);let a=items.filter(i=>{
const g=ALLSUB.find(x=>x.s===i.cat);if(g&&hid.includes(g.s))return false;
if(st.g!=="all"&&(!g||g.g!==st.g))return false;
if(st.s!=="all"&&i.cat!==st.s)return false;
if(st.src!=="all"&&i.src!==st.src)return false;
if(st.q&&!(i.title+" "+i.desc+" "+i.src).toLowerCase().includes(st.q.toLowerCase()))return false;return true});
a.sort(st.o==="src"?(x,y)=>x.src.localeCompare(y.src):st.o==="old"?(x,y)=>new Date(x.date)-new Date(y.date):(x,y)=>new Date(y.date)-new Date(x.date));return a}
function card(i,f){const nw=Date.now()-new Date(i.date)<864e5;
return `<article class="card${f?" f":""}"><div class="m">${esc(i.src)}${nw?'<span class="tg">Nuevo</span>':""}${i.demo?'<span class="tg d">Demo</span>':""}</div>
<h3>${esc(i.title)}</h3><div class="sm">${fdate(i.date)}${i.cat?" · "+esc(i.cat):""}</div><p>${esc(i.desc)}</p>
<div class="ac"><a href="${esc(i.url)}" target="_blank" rel="noopener" data-o="${esc(i.id)}">Leer original ↗</a>
<button data-f="${esc(i.id)}">${fav[i.id]?"★ Guardado":"☆ Guardar"}</button><button data-l="${esc(i.id)}">${later[i.id]?"✓ Para luego":"Leer luego"}</button></div></article>`}
function byIds(m){return Object.values(m).sort((a,b)=>new Date(b.date)-new Date(a.date))}
function render(){
$("nv").innerHTML=[["home","Portada"],["fav","Guardados ("+Object.keys(fav).length+")"],["later","Leer luego ("+Object.keys(later).length+")"],["hist","Historial"],["src","Fuentes y ajustes"]].map(([k,t])=>`<button data-v="${k}" class="${st.v===k?"on":""}">${t}</button>`).join("");
$("sg").innerHTML='<option value="all">Todas las secciones</option>'+G.map(g=>`<option value="${g.id}"${st.g===g.id?" selected":""}>${g.n}</option>`).join("");
const subs=st.g==="all"?[]:G.find(g=>g.id===st.g).s.filter(s=>!hid.includes(s));
$("ss").innerHTML='<option value="all">Todas las subsecciones</option>'+subs.map(s=>`<option${st.s===s?" selected":""}>${esc(s)}</option>`).join("");$("ss").disabled=!subs.length;
const app=$("app");let h="";
if(st.v==="home"){const a=pool();
h+=`<div class="st">${mode==="real"?"Datos reales leídos de news.json"+(stamp?" · actualizado "+fdate(stamp):""):"<b>Modo demostración.</b> Los titulares marcados «Demo» son marcadores de posición, no noticias. No hay actualización automática activa: se activa al desplegar el proyecto con su archivo news.json."}</div>`;
h+=`<div class="bar"><select id="sm"><option value="all">Todos los medios</option>${sources.map(s=>`<option${st.src===s.n?" selected":""}>${esc(s.n)}</option>`).join("")}</select><span class="sm" style="align-self:center">${a.length} artículos</span></div>`;
h+='<div class="grid">'+(a.length?a.map((i,n)=>card(i,n===0&&st.q==="")).join(""):"<p>Sin resultados.</p>")+"</div>"}
else if(st.v==="fav"||st.v==="later"){const a=byIds(st.v==="fav"?fav:later);h+='<div class="grid">'+(a.length?a.map(i=>card(i)).join(""):"<p>Aún no hay artículos aquí.</p>")+"</div>"}
else if(st.v==="hist"){h+=`<div class="bar"><button data-clr="1">Borrar historial</button></div><div class="grid">`+(hist.length?hist.map(i=>card(i)).join(""):"<p>Aún no has abierto artículos.</p>")+"</div>"}
else{h+=`<h2>Medios periodísticos</h2><p class="sm">Un medio sin dirección RSS verificada solo ofrece acceso directo a su sitio; no se simula actualización. Puedes añadir o editar la dirección RSS.</p>`;
h+=sources.map(s=>`<div class="li"><span><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.n)}</a> <span class="sm">${s.r?"RSS: "+esc(s.r):"sin RSS configurado · solo acceso directo"}</span></span><span><button data-rss="${s.id}">RSS</button> <button data-del="${s.id}">Eliminar</button></span></div>`).join("");
h+=`<div class="fm"><input id="an" placeholder="Nombre del medio"><input id="au" placeholder="https://sitio"><input id="ar" placeholder="RSS (opcional)"><button data-add="1">Añadir</button></div><button data-rst="1">Restaurar catálogo inicial</button>`;
for(const k in OFI)h+=`<h2>${k}</h2>`+OFI[k].map(([n,u])=>`<div class="li"><a href="${u}" target="_blank" rel="noopener">${n} ↗</a></div>`).join("");
h+=`<h2>Configurar categorías</h2><p class="sm">Desmarca las subsecciones que no quieras ver.</p>`+G.map(g=>`<b>${g.n}</b><br>`+g.s.map(s=>`<label class="c"><input type="checkbox" data-hc="${esc(s)}"${hid.includes(s)?"":" checked"}> ${esc(s)}</label>`).join("")+"<br>").join("")}
app.innerHTML=h}
document.addEventListener("click",e=>{const t=e.target,d=t.dataset||{};let ch=1;
const byId=id=>items.find(i=>i.id===id)||hist.find(i=>i.id===id)||fav[id]||later[id];
if(d.v)st.v=d.v;
else if(d.f){const i=byId(d.f);fav[d.f]?delete fav[d.f]:fav[d.f]=i;sv("fav",fav)}
else if(d.l){const i=byId(d.l);later[d.l]?delete later[d.l]:later[d.l]=i;sv("later",later)}
else if(d.o){const i=byId(d.o);hist=[i,...hist.filter(x=>x.id!==d.o)].slice(0,60);sv("hist",hist);ch=0}
else if(d.clr){hist=[];sv("hist",hist)}
else if(d.del){sources=sources.filter(s=>s.id!==d.del);sv("src",sources)}
else if(d.rss){const s=sources.find(x=>x.id===d.rss),r=prompt("Dirección RSS de "+s.n,s.r);if(r!==null){s.r=r.trim();sv("src",sources)}}
else if(d.add){const n=$("an").value.trim(),u=$("au").value.trim();if(n&&u){sources.push({id:"u"+Date.now(),n,u,r:$("ar").value.trim()});sv("src",sources)}}
else if(d.rst){sources=SRC0;sv("src",sources)}
else ch=0;
if(ch)render()});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.hc){const s=t.dataset.hc;hid=t.checked?hid.filter(x=>x!==s):[...hid,s];sv("hid",hid);return}
if(t.id==="sg"){st.g=t.value;st.s="all"}else if(t.id==="ss")st.s=t.value;else if(t.id==="so")st.o=t.value;else if(t.id==="sm")st.src=t.value;else return;
st.v="home";render()});
$("q").addEventListener("input",e=>{st.q=e.target.value;st.v="home";render();const q=$("q");q.focus()});
function tick(){$("dt").textContent="Consulta: "+new Date().toLocaleString("es-CL",{dateStyle:"full",timeStyle:"short"})}
tick();setInterval(tick,3e4);load();
</script></body></html>
